name: Service tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bridge contract and HTTP tests
        run: python -m unittest discover -s services -v
