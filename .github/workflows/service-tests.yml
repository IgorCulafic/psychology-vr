name: Service tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch runtime voice files
        run: git lfs pull --include="voices/runtime/**" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy==2.4.6 soundfile==0.14.0
      - name: Run bridge contract and HTTP tests
        run: python -m unittest discover -s services -v
